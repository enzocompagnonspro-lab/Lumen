<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN OS</title><style>
:root{--bg:#05070D;--panel:#0B1220;--gold:#CFAE6A;--text:#f4ead7;--muted:#9aa5b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% 0,#17243b 0,var(--bg) 40%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial;min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:34px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand h1{font-family:Georgia,serif;font-weight:500;letter-spacing:.22em;margin:0}.tag{color:var(--gold);font-size:12px;letter-spacing:.16em}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(180deg,rgba(11,18,32,.9),rgba(7,11,19,.88));border:1px solid rgba(207,174,106,.17);border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.card h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}.hero{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}.metric{font-size:34px;font-family:Georgia,serif}.muted{color:var(--muted)}.mission{padding:14px;border:1px solid rgba(207,174,106,.12);border-radius:14px;margin-top:10px}.bar{height:8px;background:#172131;border-radius:20px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#a67f3d,var(--gold));width:0}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.row:last-child{border:0}.status{font-weight:700}.PASS,.DONE{color:#8dd9a7}.READY,.IN_PROGRESS{color:#e9c980}.BLOCKED{color:#d69a9a}.ITERATE{color:#ffb86c}.scene-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.scene{padding:13px;border:1px solid rgba(207,174,106,.13);border-radius:14px}.scene b{display:block;margin-bottom:5px}.cta{display:inline-block;color:#171005;background:var(--gold);padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:10px}@media(max-width:850px){.hero,.side{grid-column:1/-1}.wrap{padding:18px}}</style></head><body><main class="wrap"><div class="brand"><div><div class="tag">SANCTUAIRE CONTROL PLANE</div><h1>LUMEN</h1></div><a class="cta" href="/projects/golden-sanctuary/index.html" target="_blank">Ouvrir Golden Sanctuary</a></div><section class="grid"><article class="card hero"><h2>Mission active</h2><div id="mission"></div></article><article class="card side"><h2>Système</h2><div id="system"></div></article><article class="card full"><h2>Scènes</h2><div class="scene-grid" id="scenes"></div></article><article class="card full"><h2>Prochaine action</h2><div id="next"></div></article></section></main><script>
async function j(u){const r=await fetch(u);return r.ok?r.json():null}async function load(){const [s,m,sc]=await Promise.all([j('/api/status'),j('/api/missions'),j('/api/scenes')]);document.getElementById('system').innerHTML=`<div class="metric ${s.health}">${s.health}</div><div class="muted">${s.mode} · v${s.version}</div><div class="row"><span>Mission</span><b>${s.current_mission}</b></div><div class="row"><span>Tâche</span><b>${s.current_task}</b></div>`;const mm=m.missions.find(x=>x.id===s.current_mission),done=mm.tasks.filter(t=>t.status==='DONE').length,p=Math.round(done/mm.tasks.length*100);document.getElementById('mission').innerHTML=`<div class="metric">${p}%</div><div><b>${mm.title}</b> <span class="muted">· ${mm.iteration||''}</span></div><div class="muted">${mm.objective}</div><div class="bar"><i style="width:${p}%"></i></div>${mm.tasks.map(t=>`<div class="row"><span>${t.id} · ${t.title}</span><b class="${t.status}">${t.status}</b></div>`).join('')}`;document.getElementById('scenes').innerHTML=sc.scenes.map(x=>`<div class="scene"><b>${x.id}</b><span class="${x.status}">${x.status}</span><div class="muted">${x.route}</div></div>`).join('');document.getElementById('next').innerHTML=`<div class="metric">${s.current_task}</div><div>${s.next_action}</div>`}load();setInterval(load,5000)</script></body></html>
