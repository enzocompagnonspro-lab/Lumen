<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search),qa=params.get('qa')||'',requested=params.get('scene')||'';const stage=document.getElementById('stage'),canonOnly=document.getElementById('canonOnly'),library=document.getElementById('library'),article=document.getElementById('article'),journey=document.getElementById('journey'),portalTarget=document.getElementById('portalTarget'),portalRing=document.getElementById('portalRing'),app=document.getElementById('app');

const STATE_KEY='lumen.state.v1';const defaultState={version:2,lastScene:'home',lastSearch:'',selectedCategory:null,viewed:[],articleSections:[],visits:{home:0,library:0,article:0,journey:0},journey:{unlocked:['vision'],completed:[],progress:{vision:0},selected:'vision'}};function readState(){try{const s=Object.assign({},defaultState,JSON.parse(localStorage.getItem(STATE_KEY)||'{}'));s.visits=Object.assign({},defaultState.visits,s.visits||{});s.journey=Object.assign({},defaultState.journey,s.journey||{});s.journey.unlocked=Array.isArray(s.journey.unlocked)?s.journey.unlocked:['vision'];s.journey.completed=Array.isArray(s.journey.completed)?s.journey.completed:[];s.journey.progress=Object.assign({vision:0},s.journey.progress||{});return s}catch{return JSON.parse(JSON.stringify(defaultState))}}let state=readState();function writeState(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state));document.getElementById('memoryMark').classList.add('on')}catch{}}function visit(scene){state.lastScene=scene;state.visits[scene]=(state.visits[scene]||0)+1;writeState()}

function sceneName(){if(article.classList.contains('active'))return'article';if(library.classList.contains('active'))return'library';if(journey.classList.contains('active'))return'journey';return'home'}function showScene(name,remember=true){library.classList.toggle('active',name==='library');article.classList.toggle('active',name==='article');journey.classList.toggle('active',name==='journey');if(remember&&!deterministic)visit(name);if(name!=='library'){closeSearch();closeDrawer()}if(name!=='journey')closeJourneyDrawer()}

const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let particles=[];function resizeParticles(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(2,Math.floor(r.width*d));canvas.height=Math.max(2,Math.floor(r.height*d));canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);const n=Math.max(28,Math.floor(r.width*r.height/44000));particles=Array.from({length:n},()=>({x:Math.random()*r.width,y:Math.random()*r.height,r:.45+Math.random()*1.25,a:.08+Math.random()*.38,v:.04+Math.random()*.16,d:(Math.random()-.5)*.08}))}resizeParticles();addEventListener('resize',resizeParticles,{passive:true});function drawParticles(){if(deterministic)return;const d=Math.min(devicePixelRatio||1,2),w=canvas.width/d,h=canvas.height/d;ctx.clearRect(0,0,w,h);for(const p of particles){p.y-=p.v;p.x+=p.d;if(p.y<-4){p.y=h+4;p.x=Math.random()*w}const rr=3+p.r*3,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);g.addColorStop(0,`rgba(255,232,185,${p.a})`);g.addColorStop(.55,`rgba(238,190,96,${p.a*.35})`);g.addColorStop(1,'rgba(255,170,70,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.fill()}}

function locked(which,badge){const el=document.getElementById(which),b=document.getElementById(badge),show=()=>b.classList.add('show'),hide=()=>b.classList.remove('show');el.addEventListener('mouseenter',show);el.addEventListener('mouseleave',hide);el.addEventListener('focus',show);el.addEventListener('blur',hide);el.addEventListener('click',e=>{e.preventDefault();show();setTimeout(hide,1000)})}locked('voir','lockVoir');locked('agir','lockAgir');

// Library living layer
const shell=document.getElementById('searchShell'),search=document.getElementById('knowledgeSearch'),results=document.getElementById('results'),drawer=document.getElementById('drawer');function openSearch(){shell.classList.add('active');search.value=state.lastSearch||'';search.focus();renderResults(search.value)}function closeSearch(){shell.classList.remove('active');results.classList.remove('active')}function normalize(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function renderResults(q='',category=null){const nq=normalize(q);let rows=DATA.contents.filter(c=>(!category||c.category===category)&&(!nq||normalize(c.title+' '+c.subtitle+' '+c.category+' '+c.type).includes(nq)));results.innerHTML='';rows.forEach(c=>{const b=document.createElement('button');b.className='result';b.setAttribute('role','option');b.innerHTML=`<div><strong>${c.title}</strong><small>${(byCat[c.category]||{}).label||c.category} · ${c.subtitle}</small></div><span>›</span>`;b.onclick=()=>{closeSearch();openContent(c.id)};results.appendChild(b)});if(!rows.length){const e=document.createElement('div');e.className='result';e.innerHTML='<div><strong>Aucun résultat</strong><small>Essaie un autre mot ou une autre catégorie.</small></div>';results.appendChild(e)}results.classList.add('active')}
search.addEventListener('input',()=>{state.lastSearch=search.value;writeState();renderResults(search.value)});search.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});document.getElementById('searchTrigger').addEventListener('click',openSearch);document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{state.selectedCategory=b.dataset.category;writeState();shell.classList.add('active');search.value='';renderResults('',b.dataset.category)}));
function closeDrawer(){drawer.classList.remove('show')}document.getElementById('drawerClose').addEventListener('click',closeDrawer);function markViewed(id){if(!state.viewed.includes(id))state.viewed.push(id);writeState()}function openContent(id){const c=byContent[id];if(!c)return;markViewed(id);document.getElementById('drawerKicker').textContent=((byCat[c.category]||{}).label||c.category)+' · '+c.type.replaceAll('_',' ');document.getElementById('drawerTitle').textContent=c.title;document.getElementById('drawerText').textContent=c.subtitle;const actions=document.getElementById('drawerActions');actions.innerHTML='';if(c.scene==='ARTICLE_MONDE_LUCIDE'){const open=document.createElement('button');open.className='primary';open.textContent='Entrer dans ce savoir';open.onclick=()=>{closeDrawer();showScene('article')};actions.appendChild(open)}const remember=document.createElement('button');remember.textContent=state.viewed.includes(id)?'Vu · mémorisé':'Mémoriser';remember.onclick=()=>{markViewed(id);remember.textContent='Vu · mémorisé'};actions.appendChild(remember);drawer.classList.add('show')}

// Journey living layer
const journeyDrawer=document.getElementById('journeyDrawer'),journeyBar=document.getElementById('journeyBar'),journeyState=document.getElementById('journeyState');function syncJourney(){const n=Math.min(5,new Set(state.articleSections).size);state.journey.progress.vision=n;if(n>=5){if(!state.journey.completed.includes('vision'))state.journey.completed.push('vision');if(!state.journey.unlocked.includes('pensee'))state.journey.unlocked.push('pensee')}writeState();renderJourneyPulses()}function renderJourneyPulses(){const v=document.getElementById('visionPulse'),p=document.getElementById('penseePulse');if(qa==='journey-idle'){v.classList.remove('on');p.classList.remove('on');return}v.classList.toggle('on',state.journey.unlocked.includes('vision')&&!state.journey.completed.includes('vision'));p.classList.toggle('on',state.journey.unlocked.includes('pensee')&&!state.journey.completed.includes('pensee'))}function closeJourneyDrawer(){const x=document.getElementById('journeyDrawer');if(x)x.classList.remove('show')}document.getElementById('journeyClose').addEventListener('click',closeJourneyDrawer);function openChamber(id){const c=byChamber[id];if(!c)return;state.journey.selected=id;writeState();const unlocked=state.journey.unlocked.includes(id),complete=state.journey.completed.includes(id);document.getElementById('journeyEyebrow').textContent='Chambre '+c.roman+' · '+(complete?'Accomplie':unlocked?'Accessible':'Verrouillée');document.getElementById('journeyTitle').textContent=c.label;let text=c.tagline+'. ';let pct=0;if(id==='vision'){const n=state.journey.progress.vision||0;pct=Math.min(100,n/5*100);text+=n+'/5 repères de lecture intégrés. La Chambre II se déverrouille lorsque les cinq sections du savoir fondateur ont été parcourues.'}else if(id==='pensee'&&unlocked){text+='La chambre est déverrouillée. Son contenu complet sera activé dans le jalon suivant.'}else if(!unlocked){text+='Cette chambre reste protégée jusqu’à ce que ses prérequis et contenus soient validés.'}el addEventListener('keydown',e=>{if(e.key==='Escape'){if(drawer.classList.contains('show'))closeDrawer();else if(shell.classList.contains('active'))closeSearch();else if(sceneName()==='article')backLibrary();else if(sceneName()==='library')showScene('home');else if(sceneName()==='journey')showScene('home')}});
// Deterministic visual QA states
if(qa==='library-search'){showScene('library',false);shell.classList.add('active');search.value='lucide';renderResults('lucide')}if(qa==='article'){showScene('article',false)}if(qa==='journey-vision'){showScene('journey',false);syncJourney();openChamber('vision')}if(qa==='e2e-seed'){try{localStorage.removeItem(STATE_KEY)}catch{}state=readState();showScene('library',false);state.lastSearch='lucide';writeState();showScene('article',false);document.querySelectorAll('[data-section]').forEach(b=>b.click());syncJourney();showScene('journey',false);openChamber('vision');document.documentElement.dataset.e2e=(state.articleSections.length===5&&state.journey.completed.includes('vision')&&state.journey.unlocked.includes('pensee'))?'seed-ok':'seed-fail'}if(qa==='e2e-verify'){showScene('journey',false);syncJourney();openChamber('vision');document.documentElement.dataset.e2e=(state.articleSections.length===5&&state.journey.completed.includes('vision')&&state.journey.unlocked.includes('pensee')&&state.lastSearch==='lucide')?'persist-ok':'persist-fail'}if(qa==='e2e-persist'){const PHASE_KEY='lumen.e2e.phase.v2';let phase='';try{phase=sessionStorage.getItem(PHASE_KEY)||''}catch{}if(phase!=='seeded'){try{localStorage.removeItem(STATE_KEY)}catch{}state=readState();showScene('library',false);state.lastSearch='lucide';writeState();showScene('article',false);document.querySelectorAll('[data-section]').forEach(b=>b.click());syncJourney();const seeded=state.articleSections.length===5&&state.journey.completed.includes('vision')&&state.journey.unlocked.includes('pensee')&&state.lastSearch==='lucide';document.documentElement.dataset.e2e=seeded?'seed-ok':'seed-fail';document.documentElement.dataset.e2eSections=String(state.articleSections.length);if(seeded){try{sessionStorage.setItem(PHASE_KEY,'seeded')}catch{}setTimeout(()=>location.reload(),180)}}else{try{sessionStorage.removeItem(PHASE_KEY)}catch{}state=readState();showScene('journey',false);syncJourney();openChamber('vision');const persiste })();
